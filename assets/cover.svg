<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">GREEN ARMOR ACADEMY — Operation Directory</title>
<desc id="desc">Minimal black, silver and emerald-green text banner for a directory-security laboratory.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090D0B"/><stop offset="1" stop-color="#18211C"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#137F4E"/><stop offset="1" stop-color="#20B973"/></linearGradient>
</defs>
<rect width="1280" height="440" fill="url(#bg)"/>
<rect x="72" y="71" width="7" height="296" rx="3.5" fill="url(#accent)"/>
<path d="M101 71H1212M101 368H1212" stroke="#5D6B62" opacity=".32" stroke-width="1.3"/>
<text x="114" y="124" fill="#27C27A" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="4">GREEN ARMOR ACADEMY</text>
